<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="gradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem / Crest Circle Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle -->
    <circle cx="60" cy="60" r="54" fill="url(#gradNavy)" filter="url(#shadow)"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="url(#gradGold)" stroke-width="3" stroke-dasharray="8 4"/>
    
    <!-- State of Perlis Yellow & Blue Geometric Wings -->
    <path d="M 30 75 Q 60 25 90 75 Q 60 55 30 75 Z" fill="#ffd100"/>
    <path d="M 40 85 Q 60 40 80 85 Q 60 70 40 85 Z" fill="#0056b3"/>
    
    <!-- Inner Compass / Star of Planning -->
    <polygon points="60,32 65,52 85,55 69,67 74,87 60,74 46,87 51,67 35,55 55,52" fill="#ffffff"/>
    <circle cx="60" cy="60" r="6" fill="#c99700"/>
  </g>

  <!-- Typography: PLANMalaysia @ PERLIS -->
  <g transform="translate(140, 20)">
    <!-- PLANMalaysia Text -->
    <text x="0" y="44" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="38" fill="#0b2545" letter-spacing="-0.5">PLAN<tspan fill="#0284c7">Malaysia</tspan></text>
    
    <!-- @ PERLIS Badge -->
    <rect x="238" y="16" width="90" height="32" rx="6" fill="#ffd100"/>
    <text x="283" y="38" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="16" fill="#0b2545" text-anchor="middle" letter-spacing="0.5">@PERLIS</text>

    <!-- Subtitle: Jabatan Perancangan Bandar dan Desa -->
    <text x="0" y="74" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="0.2">JABATAN PERANCANGAN BANDAR DAN DESA</text>
    <text x="0" y="94" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#c99700" letter-spacing="0.8">NEGERI PERLIS INDERA KAYANGAN</text>
  </g>
</svg>
